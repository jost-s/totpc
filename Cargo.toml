[package]
authors = ["Jost Schulte"]
categories = ["command-line-utilities", "authentication"]
description = "Command-line TOTP authenticator that stores 2FA secrets encrypted with GPG, like pass"
edition = "2021"
keywords = ["totp", "2fa", "otp", "cli", "gpg"]
license = "MIT"
name = "totpc"
repository = "https://github.com/jost-s/totpc"
version = "1.1.0"

[dependencies]
base32 = "0.4"
hmac = "0.12"
sha1 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "2.1"
tempfile = "3.3"
