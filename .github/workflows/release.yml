name: Release

# Runs on every push to main. release-please keeps a release PR updated. When
# it is merged, it bumps the version, writes CHANGELOG.md, creates the
# vX.Y.Z tag and publishes the GitHub release. This same run then publishes to
# crates.io and attaches the binaries.
#
# workflow_dispatch is an idempotent way to retry a run that failed part way through.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token that enables PR creation and
      # workflow triggering.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish to crates.io
    needs: release-please
    # Only when this run actually cut a release
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binary:
    name: Attach the binaries
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      # One archive covering Apple Silicon and Intel.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: totpc
          target: universal-apple-darwin
          archive: $bin-$target
          checksum: sha256
          locked: true
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
